<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body id="top">
    <header>
        <div class="logo">
            <a href="#top"><img src="./assets/img/logo-daniel.svg" alt="Daniel Logo"></a>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="#about">About me</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
            </ul>
            <div class="language-btn" aria-label="Language selection">
                <input type="radio" id="btn-de" name="language" value="DE">
                <label for="btn-de">DE</label>
                <input type="radio" id="btn-en" name="language" value="EN" checked>
                <label for="btn-en">EN</label>
            </div>
        </nav>
    </header>
    <section class="hero-section">
        <div class="hero">
            <img class="profile-image" src="./assets/img/profile_img.png" alt="Profile Image">
            <img class="photo-shadows" src="./assets/img/Photo shadows.png" alt="Background Image">
            <img class="hero-background" src="./assets/img/hero-background.png" alt="Hero Background Image">
        </div>
        <div class="hero-content">
            <div class="hero-text">
                <div class="headline-row">
                    <div class="greeting-wrapper">
                        <p class="greeting">I am</p>
                    </div>
                    <div class="name-title">
                        <p class="name">Daniel Felizetti</p>
                        <p class="title">Frontend Developer</p>
                    </div>
                </div>
                <a class="contact-btn" href="#contact">Let's Talk!</a>
            </div>
        </div>
    </section>
</body>
</html>
