<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="#top"><img src="./assets/img/logo-daniel.svg" alt="Daniel Logo"></a>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="#aboutMe">About me</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
            </ul>
            <div class="language-btn" aria-label="Language selection">
                <input type="radio" id="btn-de" name="language" value="DE">
                <label for="btn-de">DE</label>
                <input type="radio" id="btn-en" name="language" value="EN" checked>
                <label for="btn-en">EN</label>
            </div>
        </nav>
    </header>
    <section class="hero-section">
        <div class="hero">
            <img class="profile-image" src="./assets/img/profile_img.png" alt="Profile Image">
            <img class="photo-shadows" src="./assets/img/Photo shadows.png" alt="Background Image">
            <img class="hero-background" src="./assets/img/hero-background.png" alt="Hero Background Image">
        </div>
        <div class="hero-content">
            <div class="hero-text">
                <div class="headline-row">
                    <div class="greeting-wrapper">
                        <p class="greeting">I am</p>
                    </div>
                    <div class="name-title">
                        <p class="name">Daniel Felizetti</p>
                        <p class="title">Frontend Developer</p>
                    </div>
                </div>
                <a class="contact-btn" href="#contact">Let's Talk!</a>
            </div>
            <div class="scroll-indicator">
            <a href="#about"><img src="./assets/img/scroll down.svg" alt="Scroll Indicator"></a>
            </div>
        </div>
        <div class="social-media" aria-label="Social media links">
            <img src="./assets/icons/line-purple.svg" alt="Line Icon">
            <a href="https://github.com/danigalvani" target="_blank" aria-label="GitHub">
                <img src="./assets/icons/git-default.svg" alt="GitHub Icon">
            </a>
            <a href="mailto:dfelizetti@gmx.de" aria-label="Mail">
                <img src="./assets/icons/mail-default.svg" alt="Mail Icon">
            </a>
            <a href="https://www.linkedin.com/feed/" target="_blank" aria-label="LinkedIn">
                <img src="./assets/icons/linkedin-default.svg" alt="LinkedIn Icon">
            </a>
            <p class="social-media-text">dfelizetti@gmx.de</p>  
        </div>
    </section>
    <section id="aboutMe" class="aboutMe-section">
        <img class="aboutMe-shadow" src="./assets/img/purple shadow about me.png" alt="About Me Shadow">
    </section>
</body>
</html>
